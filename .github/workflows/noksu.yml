name: Build ELF Kernel(no-ksu)
on:
  workflow_call:
  workflow_dispatch:
    inputs:
        LOCALVERSIONNAME:
            description: 'Kernel Local Version Name'
            required: true
            default: '' 

jobs:
  build:
    name: Build ELF Kernel by ${{ github.actor }}
    runs-on: ubuntu-24.04
    steps:

      - name: Set Beijing Timezone
        uses: szenius/set-timezone@v1.2
        with:
          timezoneLinux: "Asia/Shanghai"

      - name: Set SWAP To 5GiB
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 5

      - name: Clean Useless Files
        run: |
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          
      - name: Get Branch Name
        id: branch-names
        uses: tj-actions/branch-names@v8

      - name: Initialize Compilation Environment
        run: |
          sudo apt-get update
          sudo apt-get install git automake build-essential bc python3 -y
          echo "BUILD_TIME=$(TZ=Asia/Shanghai date "+%Y%m%d%H%M")" >> $GITHUB_ENV
          
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch-names.outputs.current_branch }}

      - name: Get Toolchain
        run: |
          git clone https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git --depth 1 $GITHUB_WORKSPACE/toolchain/clang
          git clone https://github.com/KJ-Network/gcc-linaro-7.5.0-2019.12-x86_64_arm-linux-gnueabi.git --depth 1 $GITHUB_WORKSPACE/toolchain/gcc32
          git clone https://github.com/KJ-Network/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.git --depth 1 $GITHUB_WORKSPACE/toolchain/gcc64
          
      - name: Processing Submodules
        run: |
          git submodule update --init --remote --rebase --recursive android/Installer
          git submodule update --init --remote --rebase --recursive KernelSU
          sed -i -e '$a\'$'\n''CONFIG_KSU=n' arch/arm64/configs/mido_defconfig

      - name: Build Kernel
        run: |
          export LOCALVERSION=${{ github.event.inputs.LOCALVERSIONNAME }}
          export KBUILD_BUILD_HOST=Github-Action
          export KBUILD_BUILD_USER=$(echo ${{ github.actor }} | tr A-Z a-z)
          export ARCH="arm64"
          export SUBARCH="arm64"
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$PATH"
          export CC="clang"
          export CROSS_COMPILE="aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
          export TRIPLE="aarch64-linux-gnu-"
          make O=out mido_defconfig
          make -j$(nproc --all) O=out

      - name: Pack Kernel
        run: |
          cp out/arch/arm64/boot/Image android/Installer/
          cp out/arch/arm64/boot/dts/qcom/*.dtb android/Installer/
          
      - name: Upload Kernel Package
        uses: actions/upload-artifact@v4
        with:
          name: Mido-EK-NoKSU-${{ github.event.inputs.LOCALVERSIONNAME }}-Installer-${{ env.BUILD_TIME }}
          path: android/Installer/*
